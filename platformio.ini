; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_type = release

build_flags =
    -Os                             ; optimize for size
    -flto                           ; link-time optimization
    -fno-exceptions                 ; remove exception support
    -fno-rtti                       ; remove RTTI
    -ffunction-sections             ; allow dead-code elimination per function
    -fdata-sections                 ; allow dead-data elimination
    -fno-threadsafe-statics         ; avoid extra TLS/code for static init
    -fno-unwind-tables              ; reduce unwind tables
    -fno-asynchronous-unwind-tables
    -fshort-enums                   ; smaller enums where safe
    -fno-common                     ; tighter data placement
    -fpack-struct=1                 ; tighter struct packing (use with care)
    -Wl,--gc-sections               ; drop unused sections at link time
    -Wl,--relax                     ; relax branches/optimizations for AVR
    -Wl,-Map=${BUILD_DIR}/firmware.map  ; generate map for offline inspection
    -DNDEBUG                        ; disable asserts and debug-only code

build_unflags = -g -Og

; Library dependency finder: try to avoid pulling unused libs
lib_ldf_mode = deep+

#monitor_speed = 9600
#monitor_port = COM5